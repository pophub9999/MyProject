services:
  store:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - admin_static:/static:ro
      - media:/media:ro
    networks:
      - coolify
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.nova-store.rule=Host(`${STORE_HOST:?Set STORE_HOST}`)"
      - "traefik.http.routers.nova-store.entrypoints=https"
      - "traefik.http.routers.nova-store.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nova-store.service=nova-store"
      - "traefik.http.services.nova-store.loadbalancer.server.port=80"
      - "traefik.http.routers.nova-store-http.rule=Host(`${STORE_HOST}`)"
      - "traefik.http.routers.nova-store-http.entrypoints=http"
      - "traefik.http.routers.nova-store-http.middlewares=nova-store-https"
      - "traefik.http.middlewares.nova-store-https.redirectscheme.scheme=https"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a random secret key}
      STORE_HOST: ${STORE_HOST:?Set STORE_HOST}
    volumes:
      - store_data:/data
      - media:/media
      - admin_static:/static
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
volumes:
  store_data:
  media:
  admin_static:
networks:
  internal:
    internal: true
  coolify:
    external: true
